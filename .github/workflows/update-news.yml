name: Update news JSON

on:
  schedule:
    - cron: '0 23 * * *'   # 06:00 sáng Việt Nam
    - cron: '0 5 * * *'    # 12:00 trưa Việt Nam
    - cron: '0 11 * * *'   # 18:00 tối Việt Nam
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch RSS feed
        run: python scripts/fetch_news.py

      - name: Fetch article details
        run: python scripts/fetch_news_detail.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/news_detail.json
          git diff --cached --quiet || git commit -m "Update news JSON and detail"
          git push
