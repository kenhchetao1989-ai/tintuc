<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tin Tức</title>
  <style>
    :root{
      --bg:#f1eee7;
      --paper:#fff;
      --ink:#111;
      --muted:#666;
      --line:#e4dccd;
      --accent:#111;
      --danger:#b51d1d;
      --soft:#f9f7f3;
      --shadow:0 12px 34px rgba(0,0,0,.08);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;padding:0;background:var(--bg);color:var(--ink);
      font-family:Arial, Helvetica, sans-serif;
    }
    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}
    button{font:inherit}
    .container{max-width:1280px;margin:0 auto;padding:18px 18px 50px}

    .topbar{
      display:flex;justify-content:space-between;align-items:end;gap:14px;
      border-bottom:2px solid var(--ink);padding-bottom:12px
    }
    .brand{
      font-weight:900;font-size:clamp(2.4rem,2.8vw,3.5rem);
      letter-spacing:.04em;text-transform:uppercase;line-height:0.8
    }
    .brand small{
      display:block;font-size:.72rem;letter-spacing:.18em;color:var(--muted);margin-top:8px
    }
    .topics{
      display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;
      font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
      font-weight:700
    }

    .category-nav{
      display:flex;flex-wrap:wrap;gap:14px;padding:12px 0 18px;
      border-bottom:1px solid var(--line);margin-top:6px
    }
    .category-btn{
      border:none;background:transparent;color:var(--muted);padding:0;
      font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
      cursor:pointer;transition:.2s ease
    }
    .category-btn:hover,
    .category-btn.active{
      color:var(--ink)
    }

    .hero{
      display:grid;grid-template-columns:1.7fr 1fr;gap:22px;margin-top:18px
    }
    .card{
      background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden
    }
    .feature-image{
      height:430px;background-size:cover;background-position:center;background-repeat:no-repeat
    }
    .feature-body{padding:18px 20px 20px}
    .chip{
      display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--danger)
    }
    .feature-title{
      margin:10px 0 12px;font-size:clamp(2rem,2.5vw,3.3rem);font-weight:900;line-height:1.04
    }
    .feature-summary{
      margin:0;color:#2f2f2f;line-height:1.6;font-size:1.08rem
    }

    .side-stack{display:flex;flex-direction:column;gap:14px}
    .mini{
      display:grid;grid-template-columns:150px 1fr;gap:14px;padding:10px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow)
    }
    .mini-image{height:110px;background-size:cover;background-position:center;background-repeat:no-repeat}
    .mini-meta{
      color:var(--muted);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px
    }
    .mini-title{
      margin:0;font-size:1.08rem;line-height:1.2;font-weight:800
    }

    .content-grid{
      display:grid;grid-template-columns:2.2fr .8fr;gap:24px;margin-top:24px;align-items:start
    }
    .news-grid{
      display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px
    }
    .news-card{
      background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden
    }
    .news-thumb{height:220px;background-size:cover;background-position:center;background-repeat:no-repeat}
    .news-body{padding:16px}
    .news-meta{
      color:var(--muted);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px
    }
    .news-title{
      margin:0 0 10px;font-size:1.38rem;line-height:1.25;font-weight:800
    }
    .news-summary{
      margin:0;color:#2e2e2e;line-height:1.6;font-size:.98rem
    }

    .sidebar{
      background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 18px 10px
    }
    .sidebar h3{
      margin:0 0 16px;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)
    }
    .sidebar-list{display:flex;flex-direction:column;gap:12px}
    .sidebar-item{
      border-top:1px solid var(--line);padding-top:12px
    }
    .sidebar-item:first-child{border-top:none;padding-top:0}
    .sidebar-link{font-size:1.04rem;font-weight:800;line-height:1.4}

    .article-page{
      display:none;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:28px 26px 48px;max-width:980px;margin:0 auto
    }
    .article-page.active{display:block}
    .back-btn{
      display:inline-block;margin-bottom:18px;color:var(--danger);
      font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800
    }
    .article-header{
      border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px
    }
    .article-meta{
      display:flex;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase
    }
    .article-title{
      margin:12px 0 0;font-size:clamp(2.5rem,4vw,4.2rem);font-weight:900;line-height:1.04
    }
    .article-cover{
      width:100%;height:500px;background-size:cover;background-position:center;background-repeat:no-repeat;
      margin:18px 0 22px;border:1px solid var(--line)
    }
    .article-lead{
      font-size:1.3rem;line-height:1.7;font-weight:600;color:#222;margin-bottom:22px
    }
    .article-content{
      font-size:1.12rem;line-height:1.85;color:#1c1c1c
    }
    .article-content p{margin:0 0 1.2em}
    .article-content img{
      max-width:100%;height:auto;display:block;margin:20px auto;border:1px solid var(--line)
    }

    .scroll-top{
      position:fixed;right:22px;bottom:22px;z-index:999;
      width:50px;height:50px;border:none;border-radius:50%;
      background:var(--ink);color:#fff;cursor:pointer;box-shadow:var(--shadow);
      font-size:1.2rem;font-weight:900;display:none
    }
    .scroll-top.show{display:block}

    .empty{
      background:var(--paper);border:1px solid var(--line);padding:20px;box-shadow:var(--shadow);
      font-size:1rem;color:#333
    }

    @media (max-width:980px){
      .hero,.content-grid{grid-template-columns:1fr}
      .news-grid{grid-template-columns:1fr}
      .article-cover{height:300px}
    }
    @media (max-width:640px){
      .topbar{flex-direction:column;align-items:flex-start}
      .mini{grid-template-columns:1fr}
      .category-nav{gap:10px}
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">Tin Tức <small>Daily</small></div>
      <div class="topics">
        <span>Thời sự</span>
        <span>Thế giới</span>
        <span>Kinh doanh</span>
        <span>Giải trí</span>
      </div>
    </header>

    <nav class="category-nav" id="categoryNav"></nav>

    <main id="app"></main>
  </div>

  <button id="scrollTopBtn" class="scroll-top" title="Lên đầu trang">↑</button>

  <script>
    const categoryMap = {
      "Trang chủ": "all",
      "Thời sự": "thoi-su",
      "Thế giới": "the-gioi",
      "Kinh doanh": "kinh-doanh",
      "Thể thao": "the-thao",
      "Du lịch": "du-lich",
      "Giải trí": "giai-tri",
      "Đời sống": "doi-song"
    };

    let data = [];
    let activeCategory = "all";

    const categories = [
      "Trang chủ","Thời sự","Thế giới","Kinh doanh","Thể thao","Du lịch","Giải trí","Đời sống"
    ];

    function detectCategory(item) {
      const text = (item.title || "") + " " + (item.summary || "") + " " + (item.content || "");
      const lower = text.toLowerCase();

      if (lower.includes("bóng đá") || lower.includes("world cup") || lower.includes("thể thao") || lower.includes("cầu thủ") || lower.includes("vận động viên") || lower.includes("hlv")) return "Thể thao";
      if (lower.includes("kinh doanh") || lower.includes("doanh nghiệp") || lower.includes("chứng khoán") || lower.includes("tài chính") || lower.includes("bất động sản") || lower.includes("tiền")) return "Kinh doanh";
      if (lower.includes("đời sống") || lower.includes("gia đình") || lower.includes("sức khỏe") || lower.includes("du lịch") || lower.includes("ẩm thực") || lower.includes("y tế")) return "Đời sống";
      if (lower.includes("du lịch") || lower.includes("khách sạn") || lower.includes("du hành") || lower.includes("điểm đến")) return "Du lịch";
      if (lower.includes("giải trí") || lower.includes("sao") || lower.includes("âm nhạc") || lower.includes("phim") || lower.includes("showbiz") || lower.includes("ca sĩ")) return "Giải trí";
      if (lower.includes("thời sự") || lower.includes("tp hcm") || lower.includes("hà nội") || lower.includes("đồng nai") || lower.includes("công an") || lower.includes("pháp luật")) return "Thời sự";
      if (lower.includes("thế giới") || lower.includes("iran") || lower.includes("ukraine") || lower.includes("israel") || lower.includes("mỹ") || lower.includes("châu âu") || lower.includes("quân sự")) return "Thế giới";

      if (item.source === "dantri") {
        if (lower.includes("thể thao")) return "Thể thao";
        if (lower.includes("kinh doanh")) return "Kinh doanh";
      }

      return "Thời sự";
    }

    function formatDate(value) {
      if (!value) return "";
      const d = new Date(value);
      if (isNaN(d.getTime())) return value;
      return new Intl.DateTimeFormat("vi-VN", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(d);
    }

    function renderCategoryNav() {
      const nav = document.getElementById("categoryNav");
      nav.innerHTML = categories.map(cat => `
        <button class="category-btn ${activeCategory === cat ? "active" : ""}" data-cat="${cat}">
          ${cat}
        </button>
      `).join("");

      nav.querySelectorAll(".category-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          renderCategoryNav();
          renderHome();
        });
      });
    }

    function filteredData() {
      if (activeCategory === "all" || activeCategory === "Trang chủ") return data;
      return data.filter(item => detectCategory(item) === activeCategory);
    }

    function renderHome() {
      const list = filteredData();

      if (!list.length) {
        app.innerHTML = `<div class="empty">Không có bài viết trong mục "${activeCategory}".</div>`;
        return;
      }

      const featured = list[0];
      const secondary = list.slice(1, 7);
      const sidebar = list.slice(7, 12);

      app.innerHTML = `
        <section class="hero">
          <article class="card">
            <div class="feature-image" style="background-image:url('${featured.image || ""}');"></div>
            <div class="feature-body">
              <span class="chip">${featured.source || "Tin tức"}</span>
              <h1 class="feature-title">
                <a href="#" data-link="${featured.link}">${featured.title}</a>
              </h1>
              <p class="feature-summary">${(featured.summary || featured.content || "").slice(0, 220)}</p>
            </div>
          </article>

          <aside class="side-stack">
            ${secondary.map(item => `
              <div class="mini">
                <div class="mini-image" style="background-image:url('${item.image || ""}');"></div>
                <div>
                  <div class="mini-meta">${formatDate(item.pubDate || item.published_at)}</div>
                  <h3 class="mini-title">
                    <a href="#" data-link="${item.link}">${item.title}</a>
                  </h3>
                </div>
              </div>
            `).join("")}
          </aside>
        </section>

        <section class="content-grid">
          <div class="news-grid">
            ${list.slice(1).map(item => `
              <article class="news-card">
                <div class="news-thumb" style="background-image:url('${item.image || ""}');"></div>
                <div class="news-body">
                  <div class="news-meta">${formatDate(item.pubDate || item.published_at)}</div>
                  <h3 class="news-title"><a href="#" data-link="${item.link}">${item.title}</a></h3>
                  <p class="news-summary">${(item.summary || item.content || "").slice(0, 180)}</p>
                </div>
              </article>
            `).join("")}
          </div>

          <aside class="sidebar">
            <h3>Tin nổi bật</h3>
            <div class="sidebar-list">
              ${sidebar.map(item => `
                <div class="sidebar-item">
                  <a class="sidebar-link" href="#" data-link="${item.link}">${item.title}</a>
                </div>
              `).join("")}
            </div>
          </aside>
        </section>
      `;

      bindLinks();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderArticle(article) {
      const parts = (article.content || "").split(/\n\s*\n/).filter(Boolean);
      const articleHTML = parts.map(part => {
        if (part.startsWith("<img")) return part;
        return `<p>${part}</p>`;
      }).join("");

      app.innerHTML = `
        <article class="article-page active">
          <a href="#" class="back-btn" id="back-home">← Quay lại</a>

          <div class="article-header">
            <div class="article-meta">
              <span>${article.source || "Tin tức"}</span>
              <span>•</span>
              <span>${formatDate(article.pubDate || article.published_at)}</span>
            </div>

            <h1 class="article-title">${article.title}</h1>
          </div>

          ${article.image ? `<div class="article-cover" style="background-image:url('${article.image}');"></div>` : ""}

          ${article.summary ? `<div class="article-lead">${article.summary}</div>` : ""}

          <div class="article-content">
            ${articleHTML || "<p>Không có nội dung bài viết.</p>"}
          </div>
        </article>
      `;

      document.getElementById("back-home").addEventListener("click", (e) => {
        e.preventDefault();
        renderHome();
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function bindLinks() {
      document.querySelectorAll("[data-link]").forEach(el => {
        el.addEventListener("click", function(e) {
          e.preventDefault();
          const target = this.getAttribute("data-link");
          const article = data.find(item => item.link === target);
          if (article) {
            renderArticle(article);
          } else {
            window.open(target, "_blank");
          }
        });
      });
    }

    function setupScrollTop() {
      const btn = document.getElementById("scrollTopBtn");
      window.addEventListener("scroll", () => {
        if (window.scrollY > 300) btn.classList.add("show");
        else btn.classList.remove("show");
      });

      btn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    async function loadData() {
      try {
        const res = await fetch("./data/news_detail.json");
        if (!res.ok) throw new Error("missing");
        data = await res.json();
        renderCategoryNav();
        renderHome();
      } catch (err) {
        app.innerHTML = `
          <div class="empty">
            Không thể load dữ liệu. Hãy chắc chắn file <strong>data/news_detail.json</strong> đã tồn tại.
          </div>
        `;
      }
    }

    setupScrollTop();
    loadData();
  </script>
</body>
</html>
