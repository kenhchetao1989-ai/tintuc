<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tin tức</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f7fb;
      padding: 20px;
      margin: 0;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 32px;
    }

    .news-item {
      padding: 14px 0;
      border-bottom: 1px solid #eee;
    }

    .news-item a {
      color: #0b57d0;
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      line-height: 1.5;
    }

    .news-item a:hover {
      text-decoration: underline;
    }

    .meta {
      margin-top: 6px;
      color: #64748b;
      font-size: 12px;
    }

    .status {
      color: #475569;
      margin-bottom: 20px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tin tức</h1>
    <div id="status" class="status">Đang tải...</div>
    <div id="news"></div>
  </div>

  <script>
    async function loadNews() {
      try {
        const response = await fetch('./data/news.json', { cache: 'no-store' });

        if (!response.ok) {
          throw new Error('Không tìm thấy file data/news.json');
        }

        const data = await response.json();
        const items = Array.isArray(data.items) ? data.items : [];

        const html = items.map(item => `
          <div class="news-item">
            <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
            <div class="meta">${item.pubDate || ''}</div>
          </div>
        `).join("");

        document.getElementById('news').innerHTML = html || '<p>Không có dữ liệu.</p>';
        document.getElementById('status').textContent = `Đã tải ${items.length} tin.`;
      } catch (error) {
        console.error(error);
        document.getElementById('status').textContent = 'Lỗi: Không tải được dữ liệu tin tức.';
        document.getElementById('news').innerHTML = '<p>Vui lòng kiểm tra file data/news.json hoặc chạy workflow cập nhật dữ liệu.</p>';
      }
    }

    loadNews();
  </script>
</body>
</html>
